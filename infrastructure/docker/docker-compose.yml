version: '3.8'

services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parable
      POSTGRES_PASSWORD: parable_dev
      POSTGRES_DB: parable
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parable"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── API ─────────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
      target: base
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://parable:parable_dev@postgres:5432/parable
      - REDIS_URL=redis://redis:6379
      - ENV=development
    volumes:
      - ../../:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Web ─────────────────────────────────────────────────────
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      target: base
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ../../:/app
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
