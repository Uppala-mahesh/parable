apiVersion: v1
kind: Namespace
metadata:
  name: parable
  labels:
    name: parable
---
# ─── API Deployment ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parable-api
  namespace: parable
  labels:
    app: parable-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: parable-api
  template:
    metadata:
      labels:
        app: parable-api
    spec:
      containers:
        - name: api
          image: ghcr.io/parable-ai/parable/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: parable-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: parable-secrets
                  key: redis-url
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: parable-api
  namespace: parable
spec:
  selector:
    app: parable-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
# ─── Web Deployment ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parable-web
  namespace: parable
  labels:
    app: parable-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parable-web
  template:
    metadata:
      labels:
        app: parable-web
    spec:
      containers:
        - name: web
          image: ghcr.io/parable-ai/parable/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.parable.ai"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: parable-web
  namespace: parable
spec:
  selector:
    app: parable-web
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
# ─── Ingress ───────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parable-ingress
  namespace: parable
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - parable.ai
        - api.parable.ai
      secretName: parable-tls
  rules:
    - host: parable.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: parable-web
                port:
                  number: 80
    - host: api.parable.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: parable-api
                port:
                  number: 80
